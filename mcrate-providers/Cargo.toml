[package]
name = "mcrate-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
lofty = "0.25.5"
mcrate-core = { version = "0.1.0", path = "../mcrate-core" }
# Общий HTTP-клиент и скачивание звука (раньше лежали в этом крейте)
mcrate-net = { version = "0.1.0", path = "../mcrate-net" }
# HTTP-клиент для онлайн-провайдеров. native-tls = шифрование HTTPS средствами самой Windows (Schannel),
# поэтому для сборки не нужен C-компилятор. system-proxy = учитывает системный прокси и VPN.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
# Чтение JSON (ответы SoundCloud)
serde_json = "1.0.154"

[dev-dependencies]
mcrate-audio = { path = "../mcrate-audio" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

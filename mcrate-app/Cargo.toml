[package]
name = "mcrate-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # минимум для eframe 0.37 и egui_glass 0.2 (cargo сам выдаст понятную ошибку на старом Rust)

[dependencies]
mcrate-core = { version = "0.1.0", path = "../mcrate-core" }
mcrate-audio = { path = "../mcrate-audio" }
mcrate-providers = { path = "../mcrate-providers" }

# UI: egui поверх wgpu (GPU). persistence = сохранение настроек оформления в файл.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence", "wayland", "x11"] }
# Liquid Glass: рефракция + блюр шейдерами wgpu (MIT). 0.2.x требует egui 0.37; есть LiveBackdrop (стекло видит живой контент). API может меняться
egui = "0.37"
# Оба набора Material Symbols: залитый (по умолчанию) и контурный (пустое сердечко «Нравится»).
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }
# Liquid Glass: open outline glyphs from Lucide (ISC).
iconflow = { version = "2.1", default-features = false, features = ["pack-lucide"] }
egui_glass = "0.2.0"
# Material 3: генерация цветовых схем из одного "seed"-цвета (порт material-color-utilities)
material-colors = "0.5"
# Системные диалоги выбора файлов/папок
rfd = "0.18"
# tokio нужен Controller: многопоточная среда для поиска (SoundCloud) и block_on для локальной библиотеки
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }

# Только Windows: winit даёт доступ к DWM (Mica/Acrylic) через WindowExtWindows.
# Версия должна совпадать с той, что использует eframe (0.30.x).
[target.'cfg(windows)'.dependencies]
winit = "0.30"
# Глобальные медиаклавиши (Play/Pause, Следующий, Предыдущий) работают и когда окно не в фокусе.
# На Windows это RegisterHotKey: нужен цикл сообщений главного потока, его даёт winit.
global-hotkey = "0.10"
# Иконка в области уведомлений (трей) и её меню: окно можно скрыть, музыка продолжит играть.
tray-icon = { version = "0.27", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"